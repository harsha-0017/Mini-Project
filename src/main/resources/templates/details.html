<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${camp.title + ' | CareConnect'}">Camp details</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="nav"><a class="brand" th:href="@{/}"><span>✚</span> CareConnect</a></header><main class="content narrow"><a class="back" th:href="@{/}">← Back to camps</a><article class="detail"><span class="tag" th:text="${camp.category.label}">Category</span><h1 th:text="${camp.title}">Title</h1><p class="lead" th:text="${camp.description}">Description</p><div class="detail-grid"><div><b>When</b><p th:text="${#temporals.format(camp.date, 'EEEE, dd MMMM yyyy') + ' at ' + #temporals.format(camp.startTime, 'HH:mm')}">Date</p></div><div><b>Where</b><p th:text="${camp.venue + ', ' + camp.city}">Venue</p></div><div><b>Organizer</b><p th:text="${camp.organizerName}">Organizer</p></div><div><b>Capacity</b><p th:text="${camp.capacity + ' people'}">Capacity</p></div></div><a class="button" th:href="'tel:' + ${camp.contact}">Contact organizer</a></article></main></body></html>
