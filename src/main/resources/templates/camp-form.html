<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Add camp | CareConnect</title><link rel="stylesheet" th:href="@{/css/style.css}"></head><body><header class="nav"><a class="brand" th:href="@{/}"><span>✚</span> CareConnect</a></header><main class="content narrow"><div class="section-heading"><div><p class="eyebrow">Organizer dashboard</p><h1>Add a health camp</h1></div></div><form class="camp-form" method="post" th:action="@{/organizer/camps}" th:object="${camp}"><label>Title<input th:field="*{title}"><small th:errors="*{title}"></small></label><label>Category<select th:field="*{category}"><option value="">Choose one</option><option th:each="item : ${categories}" th:value="${item}" th:text="${item.label}"></option></select><small th:errors="*{category}"></small></label><div class="form-grid"><label>City<input th:field="*{city}"><small th:errors="*{city}"></small></label><label>Venue<input th:field="*{venue}"><small th:errors="*{venue}"></small></label><label>Date<input type="date" th:field="*{date}"><small th:errors="*{date}"></small></label><label>Start time<input type="time" th:field="*{startTime}"><small th:errors="*{startTime}"></small></label></div><label>Description<textarea th:field="*{description}" rows="5"></textarea><small th:errors="*{description}"></small></label><div class="form-grid"><label>Organizer name<input th:field="*{organizerName}"><small th:errors="*{organizerName}"></small></label><label>Contact<input th:field="*{contact}"><small th:errors="*{contact}"></small></label><label>Capacity<input type="number" min="1" th:field="*{capacity}"><small th:errors="*{capacity}"></small></label></div><button class="button" type="submit">Publish camp</button></form></main></body></html>
